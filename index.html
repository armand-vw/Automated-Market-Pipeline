<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Serverless market data pipeline and analytics dashboard."
    />
    <title>Automated Market Pipeline</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
      defer
    ></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <div>
          <h1>Automated Market Pipeline</h1>
          <p class="subtitle">Serverless market data &amp; analytics dashboard</p>
        </div>
        <span id="pipeline-status" class="status-badge" data-state="loading">
          Pipeline status &middot; connecting&hellip;
        </span>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <label for="asset-select">Asset</label>
        <select id="asset-select" aria-label="Select asset"></select>
      </section>

      <section class="cards" aria-label="Summary metrics">
        <article class="card">
          <h2>Latest Close</h2>
          <p id="latest-close" class="metric">—</p>
        </article>
        <article class="card">
          <h2>24h Change</h2>
          <p id="daily-change" class="metric">—</p>
        </article>
        <article class="card">
          <h2>7-Day SMA</h2>
          <p id="sma" class="metric">—</p>
        </article>
      </section>

      <section class="panel">
        <h2>Price History</h2>
        <div class="chart-wrap">
          <canvas id="price-chart"></canvas>
          <div id="chart-loading" class="chart-loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Historical Logs</h2>
        <div class="table-wrap">
          <table id="logs-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Open</th>
                <th>High</th>
                <th>Low</th>
                <th>Close</th>
                <th>Volume</th>
                <th>Return %</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Data refreshed nightly &middot; Powered by GitHub Actions</p>
      </div>
    </footer>
  </body>
</html>
